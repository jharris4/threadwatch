name: tests

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository. Without this the workflow takes
# the repository default for GITHUB_TOKEN, which on a public repo is
# whatever the org or repo setting happens to be.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12"]   # 3.11 is what Debian bookworm ships on the Pi
    steps:
      # Pinned by commit, not by the moving v4 / v5 tags: a major tag is
      # repointed by its owner, so @v4 is "whatever actions/checkout is
      # today". The comment says which release each sha is.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # -t . so discovery imports tests/__init__.py, which installs the
      # mDNS guard before any test module (tests/no_lan). Without it the
      # guard depends on some module happening to import tests.no_lan,
      # and the run sends real multicast on the CI runner's network.
      - run: python -m unittest discover -t . -s tests -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          # One version is enough: ruff.toml sets target-version itself, so
          # what it reports does not depend on the interpreter running it.
          python-version: "3.11"
      # requirements-dev.txt, not requirements.txt: ruff is a development
      # tool and stays out of what the Pi installs. The version there is
      # pinned exactly, so a ruff release cannot turn main red on its own.
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  docker:
    runs-on: ubuntu-latest
    # This job builds and runs the pull request's own Dockerfile.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - run: docker build -t threadwatch .
      - run: docker run --rm threadwatch --help
