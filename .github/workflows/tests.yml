name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]   # 3.11 is what Debian bookworm ships on the Pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      # -t . so discovery imports tests/__init__.py, which installs the
      # mDNS guard before any test module (tests/no_lan). Without it the
      # guard depends on some module happening to import tests.no_lan,
      # and the run sends real multicast on the CI runner's network.
      - run: python -m unittest discover -t . -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t threadwatch .
      - run: docker run --rm threadwatch --help
