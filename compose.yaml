# docker compose up -d
# Before the first start: cp config/config.example.toml config/config.toml and
# set your channel; see docs/DOCKER.md for the dongle device path.
services:
  capture:
    build: .
    image: threadwatch
    command: capture
    restart: unless-stopped
    # On stop the recorder saves its state, then drains queued alerts and
    # held digests for up to 15 s (alerts.Dispatcher.close) before it
    # exits. Docker's default grace is 10 s, so with a sink unreachable
    # (the very condition being recorded) the drain was cut short by
    # SIGKILL; systemd gives it 90 s.
    stop_grace_period: 30s
    # The recorder finds border routers over mDNS, which is link-local
    # multicast that the default bridge network never carries to the LAN;
    # the host's network namespace does (mdns.py, [border_routers]). The
    # daemon listens on no port of its own, so nothing else changes.
    network_mode: host
    devices:
      # Left side: the dongle on the host. /dev/serial/by-id/usb-Nordic_Semiconductor_*
      # survives re-enumeration; a plain /dev/ttyACM0 works while there is one dongle.
      - /dev/ttyACM0:/dev/ttyACM0
    # The image runs as uid 1000, not root, so what it writes into the two
    # bind mounts below stays readable and writable by an ordinary host user
    # (docs/DOCKER.md). Where the host's owner is someone else, uncomment
    # and set it to that user, and chown ./config and ./data to match.
    # user: "1000:1000"
    #
    # The dongle is usually root:dialout mode 660, so a non-root container
    # needs the dialout group. 20 is dialout on Debian and Raspberry Pi OS;
    # check yours with `stat -c %g /dev/ttyACM0` and change it if it differs.
    group_add:
      - "20"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    env_file:
      - path: ./config/alerts.env   # alert/heartbeat secrets, optional
        required: false

  web:
    image: threadwatch
    command: web
    restart: unless-stopped
    depends_on: [capture]
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
