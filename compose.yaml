# docker compose up -d
# Before the first start: cp config/config.example.toml config/config.toml and
# set your channel; see docs/DOCKER.md for the dongle device path.
services:
  capture:
    build: .
    image: threadwatch
    command: record
    restart: unless-stopped
    # On stop the recorder saves its state, then drains queued alerts and
    # held digests for up to 15 s (alerts.Dispatcher.close) before it
    # exits. Docker's default grace is 10 s, so with a sink unreachable
    # (the very condition being recorded) the drain was cut short by
    # SIGKILL; systemd gives it 90 s.
    stop_grace_period: 30s
    # The recorder finds border routers over mDNS, which is link-local
    # multicast that the default bridge network never carries to the LAN;
    # the host's network namespace does (mdns.py, [border_routers]). The
    # daemon listens on no port of its own, so nothing else changes.
    network_mode: host
    devices:
      # Left side: the dongle on the host. /dev/serial/by-id/usb-Nordic_Semiconductor_*
      # survives re-enumeration; a plain /dev/ttyACM0 works while there is one dongle.
      - /dev/ttyACM0:/dev/ttyACM0
    # The image runs as uid 1000, not root, so what it writes into the two
    # bind mounts below stays readable and writable by an ordinary host user
    # (docs/DOCKER.md). Where the host's owner is someone else, uncomment
    # and set it to that user, and chown ./config and ./data to match.
    # user: "1000:1000"
    #
    # The dongle is usually root:dialout mode 660, so a non-root container
    # needs the dialout group. 20 is dialout on Debian and Raspberry Pi OS;
    # check yours with `stat -c %g /dev/ttyACM0` and change it if it differs.
    group_add:
      - "20"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    # required: false needs Docker Compose 2.20 or newer; an older one
    # rejects the whole file naming env_file. docs/DOCKER.md gives the
    # classic form to use instead.
    env_file:
      - path: ./config/alerts.env   # alert/heartbeat secrets, optional
        required: false

  web:
    # Both services build the same image; only one of them needs to say
    # so, but naming it without a build: made "threadwatch" resolve to
    # docker.io/library/threadwatch:latest whenever the tag was not
    # already local. The documented flow (up -d --build) builds it first
    # and never hit that, but `up -d web` on its own, a compose pull, or
    # an up after an image prune would either fail confusingly or pull a
    # stranger's image and run it against this config.
    build: .
    image: threadwatch
    # 0.0.0.0 is this container's own network namespace, not the host's.
    # The published port below forwards to the container's bridge address,
    # so a server on the container's loopback - the [web] bind default,
    # right for a native install - refuses every connection that arrives.
    # What keeps the pages off the LAN here is the loopback publish.
    command: ["serve", "--bind", "0.0.0.0"]
    restart: unless-stopped
    depends_on: [capture]
    # Published on loopback only: the pages have no authentication, and on
    # a Linux host a plain "8080:8080" installs DNAT rules in the DOCKER
    # chain, which is traversed before ufw's INPUT rules - so a host
    # firewall the operator believes is closing the port does not. Reach
    # them over ssh (ssh -L 8080:127.0.0.1:8080 user@host), or widen this
    # deliberately once something in front of it authenticates.
    ports:
      - "127.0.0.1:8080:8080"
    # This is the only process the compose file publishes, and nothing in
    # front of it authenticates, so it runs as a user that cannot open the
    # secrets in ./config. web reads config.toml and devices.json and
    # never credentials.toml, alerts.env or ha.env; those three are 0400
    # owner-only, and 65534 (nobody) owns none of them. Everything else it
    # reads - config.toml, devices.json, the ring and the state under
    # ./data - the recorder writes world-readable (umask 022).
    #
    # Mounting only the two files instead would go stale: adopt and import
    # rewrite devices.json by rename, and a bind mount of a file follows
    # the old inode, so the pages would keep the names the container
    # started with. If your host's config/ or data/ is not world-readable
    # (some NAS images default to umask 077), the pages fail to load: set
    # this to the same uid:gid as capture, and the mount below is again
    # what limits what web can read.
    user: "65534:65534"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
