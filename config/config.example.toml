# threadwatch configuration. Copy to config.toml and edit.
# config.toml and devices.json are gitignored: they describe YOUR network.

[network]
# Thread channel (802.15.4 channel 11-26). Find yours via your border router
# (e.g. OTBR REST /node/dataset/active, or Home Assistant Thread panel).
channel = 25
# Optional, purely informational:
# network_name = "MyHome"
# pan_id = "0x4e21"
# The network key is deliberately not here either: it lives in its own
# read-only file, see [credentials] below and docs/CREDENTIALS.md.

[capture]
# serial_port = "/dev/ttyACM0"   # leave unset to auto-detect the dongle
# data_dir = "~/threadwatch-data"  # default: <repo>/data
keep_files = 168                  # hourly ring files to retain (168 = 1 week)
# keep_gb = 4                     # ...and never more than this much on disk (oldest go first)
# Copy the ring into data/incidents/ by itself when a critical event
# (phase_locked_storm) fires, at most once per six hours (counted from the
# newest auto-* incident on disk, so a restart does not reset it). Off by default:
# an incident is the size of the ring. 'threadwatch incidents' lists them.
# freeze_on_critical = true

[devices]
# Inventory that maps extended addresses to human names (see names.py docstring).
inventory = "devices.json"

[quiet]
# Silence before a device_quiet alert, by inventory role (role / threadRole
# router, reed, border-router, border-router-leader vs everything else).
# Sleepy end devices poll every few seconds, so they are not quiet from the
# sniffer's point of view; raise end_device_s only if a class of yours
# genuinely sleeps for long stretches.
end_device_s = 1800        # 30 min
router_s = 1800            # 30 min
# Devices the sniffer hears below this average RSSI are logged at notice
# (not paged) when quiet: at the edge of range, silence is usually fading.
min_rssi_dbm = -82

[polls]
# A poll_starvation episode that opens within this long of the previous
# one's close is logged at notice (not paged). A device that starves and
# recovers every few minutes, each time with an ordinary ACK and no rejoin,
# is a parent whose ACKs the sniffer only sometimes hears, not a device
# losing its parent. One warning, then notices until it has stayed answered
# this long. 0 pages every episode. Devices heard below [quiet] min_rssi_dbm
# are logged at notice regardless, as for device_quiet.
rearm_s = 3600             # 60 min

[link]
# Slow link degradation: a device still heard, but with its average RSSI at
# the sniffer this far below its own daily reference for this long, is
# logged at notice (rssi_degradation). A moved or obstructed device, a
# failing antenna, interference near it. 0 disables.
drop_db = 8
hold_s = 1800              # 30 min

[summary]
# One daily_summary event per local day at this hour (0-23; -1 disables):
# frames, devices heard, quiet / unknown / degraded devices, event counts.
# notice lands in the log and review pages only; "warning" sends it to
# whatever pages you.
hour = 8
severity = "notice"

[detect]
flood_multiplier = 3.0     # a 10 s window this many times the baseline is a flood
flood_min_frames = 400     # absolute floor so small meshes don't false-alarm
period_min_s = 40.0        # phase-lock signature: flood onsets recurring
period_max_s = 180.0       #   with a stable period in this range
period_onsets = 3          # consecutive periodic onsets before alerting
alert_cooldown_s = 1800.0

[web]
# Review pages: bin/threadwatch web (systemd/threadwatch-web.service).
# Read-only, no authentication: keep it on your LAN or behind your proxy.
bind = "0.0.0.0"
port = 8080

[alerts]
# Where warning/critical events go. Any number of sinks; each has its own
# severity floor and per-event cooldown. Secrets go in config/alerts.env as
# environment variables and are referenced as ${NAME}. Full reference and
# recipes (Home Assistant, ntfy, Gotify, Discord, ...): docs/ALERTING.md
# Test everything below with:  bin/threadwatch alert-test
#
# Shorthand kept from earlier versions - one plain JSON POST of the event
# record, warning and above:
# webhook_url = "http://homeassistant.local:8123/api/webhook/threadwatch-<random>"
#
# [[alerts.sinks]]
# name = "home-assistant"
# type = "http"
# url = "http://homeassistant.local:8123/api/webhook/threadwatch-<random>"
# min_severity = "warning"       # info | notice | warning | critical
# cooldown_s = 300               # per event name, per sink; held-back events arrive as one digest
#
# [[alerts.sinks]]
# name = "phone"
# type = "ntfy"                  # preset over the http sink
# url = "https://ntfy.example.net"
# topic = "alerts"
# token = "${NTFY_TOKEN}"
# min_severity = "warning"
#
# [[alerts.sinks]]
# name = "local-script"
# type = "command"
# command = ["/usr/local/bin/my-alert.sh"]   # event record JSON on stdin

# Liveness: tell an external monitor "still capturing" so it can page when
# the recorder itself dies. One entry per monitor; see docs/ALERTING.md for
# Gatus, Healthchecks.io and Uptime Kuma forms.
#
# [[heartbeats]]
# name = "gatus"
# url = "http://gatus.example.net:8080/api/v1/endpoints/iot_threadwatch/external?success=true"
# failure_url = "http://gatus.example.net:8080/api/v1/endpoints/iot_threadwatch/external?success=false&error=capture+stalled"
# headers = { Authorization = "Bearer ${GATUS_THREADWATCH_TOKEN}" }
# interval_s = 60

[credentials]
# REQUIRED. Path (relative to this directory) of a separate, gitignored,
# read-only file holding the Thread network key. The recorder does not
# start without it: sleepy devices, rejoins, poll starvation and the
# partition are all behind MAC-layer encryption. docs/CREDENTIALS.md says
# how to create it; the default path needs no setting here.
# file = "credentials.toml"
