# threadwatch configuration. Copy to config.toml and edit.
# config.toml and devices.json are gitignored: they describe YOUR network.

[network]
# Thread channel (802.15.4 channel 11-26). Find yours via your border router
# (e.g. OTBR REST /node/dataset/active, or Home Assistant Thread panel).
channel = 25
# Optional, purely informational:
# network_name = "MyHome"
# pan_id = "0x4e21"
# NOTE: deliberately no credentials here. Capture, storm detection and
# device tracking all work from cleartext MAC headers - the network key is
# not needed and should not be stored on the capture box.

[capture]
# serial_port = "/dev/ttyACM0"   # leave unset to auto-detect the dongle
# data_dir = "~/threadwatch-data"  # default: <repo>/data
keep_files = 168                  # hourly ring files to retain (168 = 1 week)

[devices]
# Inventory that maps extended addresses to human names (see names.py docstring).
inventory = "devices.json"

[quiet]
# Silence before a device_quiet alert. Only devices whose devices.json entry
# has role = "router" or "border-router" use the short window: cleartext
# frames cannot tell a router from a busy end device, and end devices that
# report every few seconds by day can sleep for over an hour at night.
end_device_s = 5400        # 90 min
router_s = 1800            # 30 min

[detect]
flood_multiplier = 3.0     # a 10 s window this many times the baseline is a flood
flood_min_frames = 400     # absolute floor so small meshes don't false-alarm
period_min_s = 40.0        # phase-lock signature: flood onsets recurring
period_max_s = 180.0       #   with a stable period in this range
period_onsets = 3          # consecutive periodic onsets before alerting
alert_cooldown_s = 1800.0

[alerts]
# Where warning/critical events go. Any number of sinks; each has its own
# severity floor and per-event cooldown. Secrets go in config/alerts.env as
# environment variables and are referenced as ${NAME}. Full reference and
# recipes (Home Assistant, ntfy, Gotify, Discord, ...): docs/ALERTING.md
# Test everything below with:  bin/threadwatch alert-test
#
# Shorthand kept from earlier versions - one plain JSON POST of the event
# record, warning and above:
# webhook_url = "http://homeassistant.local:8123/api/webhook/threadwatch-<random>"
#
# [[alerts.sinks]]
# name = "home-assistant"
# type = "http"
# url = "http://homeassistant.local:8123/api/webhook/threadwatch-<random>"
# min_severity = "warning"       # info | notice | warning | critical
# cooldown_s = 300               # per event name, per sink
#
# [[alerts.sinks]]
# name = "phone"
# type = "ntfy"                  # preset over the http sink
# url = "https://ntfy.example.net"
# topic = "alerts"
# token = "${NTFY_TOKEN}"
# min_severity = "warning"
#
# [[alerts.sinks]]
# name = "local-script"
# type = "command"
# command = ["/usr/local/bin/my-alert.sh"]   # event record JSON on stdin

# Liveness: tell an external monitor "still capturing" so it can page when
# the recorder itself dies. One entry per monitor; see docs/ALERTING.md for
# Gatus, Healthchecks.io and Uptime Kuma forms.
#
# [[heartbeats]]
# name = "gatus"
# url = "http://gatus.example.net:8080/api/v1/endpoints/iot_threadwatch/external?success=true"
# failure_url = "http://gatus.example.net:8080/api/v1/endpoints/iot_threadwatch/external?success=false&error=capture+stalled"
# headers = { Authorization = "Bearer ${GATUS_THREADWATCH_TOKEN}" }
# interval_s = 60

[credentials]
# OPTIONAL. Path to a separate, gitignored, read-only file holding the Thread
# network key, enabling decryption-based analysis (MLE rejoin/partition
# visibility, SRP auto-naming). Capture works fully without this.
# Create it read-only:  see docs/CREDENTIALS.md
# file = "credentials.toml"
