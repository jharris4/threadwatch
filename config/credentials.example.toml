# Thread network key. Copy to config/credentials.toml, then:
#     chmod 600 config/credentials.toml
# credentials.toml is gitignored and the recorder does not start without it.
# docs/CREDENTIALS.md says where the key comes from; with Home Assistant,
# `bin/threadwatch import --write` writes this file for you.
[credentials]
network_key = "PUT_32_HEX_CHARS_HERE"
